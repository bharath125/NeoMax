# Production stack for a single host:  caddy (HTTPS) -> api  +  worker  +  redis.
# MongoDB is not included: use MongoDB Atlas (set MONGO_URI in backend/.env.production).
#
#   docker compose up -d --build        start / update everything
#   docker compose logs -f api worker   follow logs
#   docker compose ps                   health of each service
#
# Compose reads API_DOMAIN and ACME_EMAIL from the .env file next to this file (copy .env.example).

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: neomax-backend:latest
  restart: unless-stopped
  env_file: backend/.env.production
  environment:
    NODE_ENV: production
    PORT: "4000"
    # Always talk to the Redis container, whatever REDIS_URL says in the env file.
    REDIS_URL: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Same image, different command. It has no HTTP port, so it has no healthcheck; `restart` brings it back if it crashes.
  worker:
    <<: *backend
    command: ["node", "src/queue/generateVideo.worker.js"]
    # Give an in-flight job time to finish after `docker compose stop` before Docker force-kills it.
    stop_grace_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly keeps queued jobs across restarts; BullMQ requires that keys are never evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env (e.g. api.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  caddy-data:
  caddy-config:
